version: 0.2

phases:
  install:
    commands:
      - echo "Installing build dependencies"
      - node --version
      - npm --version

 pre_build:
  commands:
    - echo "Running SATC unit tests"
    - npm test
    - echo "Running SATC code quality checks"
    - npm run quality

  build:
    commands:
      - echo "Building SATC e-commerce application"
      - rm -rf build
      - mkdir -p build
      - cp index.html app.js package.json appspec.yml build/
      - cp -r scripts build/

  post_build:
    commands:
      - echo "SATC build completed successfully"

artifacts:
  files:
    - '**/*'
  base-directory: build
  discard-paths: no
